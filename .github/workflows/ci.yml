# CI — install, build, typecheck, test on every push and PR.
#
# Notes:
# - This is the PR gate. release.yml runs the same TS gate on push to main
#   (before publishing); the overlap on main is intentional and cheap.
# - No lint step, and currently no way to add the verus-sdk one. That repo uses
#   typescript-eslint, which peer-caps at `typescript <6.1.0` and reads the
#   legacy compiler API; this package is on TypeScript 7 (the native port),
#   whose package exposes neither `createProgram` nor `createSourceFile`. So a
#   typed eslint setup is not merely un-installed here, it is un-installable
#   until typescript-eslint ships TS-7 support. A `lint` script that always
#   fails was removed rather than left to rot. Revisit when that support lands
#   (or adopt a linter that does not depend on the TS compiler API).
#   The runnable gate is tsc build -> tsc --noEmit -> vitest, plus the Rust
#   crate's `cargo test` (its own job).
# - Node matrix: runtime floor is Node 18 (engines), but the test toolchain and
#   OIDC publishing want newer; 20/22/24 are exercised here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  crate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SHA-pinned (tag-hijack defense). dtolnay/rust-toolchain selects the
      # toolchain from the ref name, so a SHA pin needs an explicit `toolchain`.
      # The version MUST match crate/rust-toolchain.toml — it is the toolchain
      # that built the committed crate/pkg.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: '1.95.0'

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: crate

      # Param-free regression net for the ZIP-243 sighash / v4 serializer.
      - name: cargo test
        working-directory: crate
        run: cargo test

  # The published WASM prover (crate/pkg) is committed. Compiling it from source
  # is a HARD gate (catches source that no longer builds for wasm32). Both inputs
  # that decide the output bytes are now pinned — rustc (1.95.0, matching
  # crate/rust-toolchain.toml) and wasm-pack/wasm-opt (0.14.0) — so drift should
  # no longer be routine. It stays a WARNING rather than a failure because the
  # pins are NOT sufficient on their own: the binary embeds absolute CARGO_HOME
  # paths, so a runner with a different home cannot match byte-for-byte. What
  # protects the published package is release.yml, which rebuilds the prover
  # from the tagged source and publishes that — this job only tells you the
  # committed convenience copy has gone stale.
  wasm-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same pin as the `crate` job and crate/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: crate

      # Pinned, not `| sh` from the installer: that script always fetches the
      # LATEST wasm-pack, and wasm-pack bundles the wasm-opt that rewrites the
      # binary — so an upstream release would silently change the output bytes.
      # 0.14.0 built the committed crate/pkg. Cached by rust-cache above.
      - name: Install wasm-pack (pinned)
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Rebuild WASM (compile = hard gate) and report any binary drift
        run: |
          wasm-pack build crate --target web --release
          if git diff --quiet -- crate/pkg; then
            echo "crate/pkg matches a fresh build."
          else
            echo "::warning::crate/pkg differs from a fresh build. Expected unless the toolchain matches the one that built the committed binary. If you changed crate/src, rebuild ('wasm-pack build crate --target web --release') and commit crate/pkg."
          fi
